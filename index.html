<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand Perception Survey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #14181c;
      --panel: #1c2127;
      --panel-alt: #262c33;
      --line: #333b44;
      --ink: #edeff2;
      --ink-dim: #8b93a1;
      --ink-faint: #5a6270;
      --amber: #ffc33d;
      --amber-dim: #8a6c1f;
      --red: #e1483d;
      --radius: 10px;
      --display: 'Rajdhani', sans-serif;
      --body: 'Inter', sans-serif;
      --mono: 'IBM Plex Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 20px 60px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .brand-mark {
      font-family: var(--display);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--ink-dim);
    }

    .brand-mark span {
      color: var(--amber);
    }

    .results-link {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-faint);
      text-decoration: none;
      letter-spacing: .03em;
      border: 1px solid var(--line);
      padding: 6px 10px;
      border-radius: 6px;
      transition: .15s;
    }

    .results-link:hover {
      color: var(--amber);
      border-color: var(--amber-dim);
    }

    .gauge {
      display: flex;
      gap: 4px;
      margin-bottom: 26px;
    }

    .gauge .tick {
      flex: 1;
      height: 6px;
      background: var(--panel-alt);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .gauge .tick.done::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--amber);
    }

    .gauge .tick.current::after {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--red);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 28px;
    }

    h1 {
      font-family: var(--display);
      font-weight: 700;
      font-size: 30px;
      letter-spacing: .01em;
      line-height: 1.15;
    }

    h2 {
      font-family: var(--display);
      font-weight: 600;
      font-size: 22px;
      color: var(--ink);
    }

    .eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 8px;
    }

    .lede {
      color: var(--ink-dim);
      font-size: 14.5px;
      line-height: 1.6;
      margin-top: 12px;
    }

    .btn {
      font-family: var(--body);
      font-weight: 600;
      font-size: 14.5px;
      background: var(--amber);
      color: #1a1400;
      border: none;
      padding: 13px 22px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform .1s ease, filter .15s ease;
    }

    .btn:hover {
      filter: brightness(1.08);
    }

    .btn:active {
      transform: scale(.98);
    }

    .btn:disabled {
      background: var(--panel-alt);
      color: var(--ink-faint);
      cursor: not-allowed;
    }

    .btn-ghost {
      background: transparent;
      color: var(--ink-dim);
      border: 1px solid var(--line);
      font-family: var(--body);
      font-size: 13.5px;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-ghost:hover {
      border-color: var(--ink-faint);
      color: var(--ink);
    }

    input[type=text] {
      width: 100%;
      background: var(--panel-alt);
      border: 1px solid var(--line);
      color: var(--ink);
      font-family: var(--body);
      font-size: 15px;
      padding: 13px 14px;
      border-radius: 8px;
      margin-top: 16px;
    }

    input[type=text]:focus {
      outline: 2px solid var(--amber-dim);
    }

    .podium {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin: 20px 0 22px;
    }

    .slot {
      background: var(--panel-alt);
      border: 1px dashed var(--line);
      border-radius: 8px;
      min-height: 74px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      cursor: default;
      transition: .15s;
      position: relative;
    }

    .slot .rank-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: .1em;
      color: var(--ink-faint);
      position: absolute;
      top: 6px;
      left: 8px;
    }

    .slot.filled {
      border-style: solid;
      border-color: var(--amber-dim);
      cursor: pointer;
      background: #20262c;
    }

    .slot .placeholder {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--ink-faint);
      text-align: center;
      padding-top: 6px;
      letter-spacing: .03em;
    }

    .slot .brand-name {
      font-family: var(--display);
      font-weight: 700;
      font-size: 16px;
      margin-top: 10px;
    }

    .slot .clear-x {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--ink-faint);
      margin-top: 2px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .card {
      background: var(--panel-alt);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 14px;
      cursor: pointer;
      transition: .12s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card:hover {
      border-color: var(--amber-dim);
    }

    .card.picked {
      opacity: .35;
      cursor: not-allowed;
    }

    .card .name {
      font-family: var(--display);
      font-weight: 600;
      font-size: 16.5px;
    }

    .card .cat {
      font-family: var(--mono);
      font-size: 9.5px;
      color: var(--ink-faint);
      border: 1px solid var(--line);
      padding: 2px 6px;
      border-radius: 4px;
      letter-spacing: .05em;
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
    }

    .round-count {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--ink-faint);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
      font-size: 13px;
    }

    th,
    td {
      padding: 8px 6px;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }

    th {
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--ink-faint);
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    td.attr {
      font-family: var(--display);
      font-weight: 600;
      font-size: 14.5px;
    }

    td.score {
      font-family: var(--mono);
    }

    .lead {
      color: var(--amber);
      font-weight: 600;
    }

    .strength-block {
      margin-top: 10px;
      padding: 14px 16px;
      background: var(--panel-alt);
      border-radius: 8px;
      border: 1px solid var(--line);
    }

    .strength-block h3 {
      font-family: var(--display);
      font-size: 17px;
      margin-bottom: 6px;
    }

    .strength-block ul {
      list-style: none;
      font-size: 13.5px;
      color: var(--ink-dim);
    }

    .strength-block li {
      padding: 3px 0;
    }

    .strength-block .margin {
      color: var(--ink-faint);
      font-family: var(--mono);
      font-size: 11px;
    }

    .muted-note {
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--ink-faint);
      margin-top: 18px;
      line-height: 1.6;
    }

    .toggle {
      font-family: var(--mono);
      font-size: 11.5px;
      color: var(--amber);
      background: none;
      border: none;
      cursor: pointer;
      margin-top: 16px;
      padding: 0;
      text-decoration: underline;
    }

    @media (max-width:480px) {
      .grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <div class="app" id="app"></div>

  <script>
    const ATTRIBUTES = [
      { id: 'afford', name: 'Affordability', hint: 'Which brand gives the most car for the money?' },
      { id: 'reliab', name: 'Reliability', hint: 'Jarang rewel, jarang masuk bengkel.' },
      { id: 'aftersales', name: 'Aftersales & Spare Parts', hint: 'Sparepart gampang dicari & cepat datang.' },
      { id: 'maint', name: 'Ease & Cost of Maintenance', hint: 'Servis rutin murah dan gampang.' },
      { id: 'drive', name: 'Driving Experience', hint: 'Nyaman & enak dikendarai sehari-hari.' },
      { id: 'design', name: 'Design & Status', hint: 'Desain yang bikin pede & terlihat prestige.' },
      { id: 'resale', name: 'Resale Value', hint: 'Harga jual kembali tetap tinggi.' },
      { id: 'fuel', name: 'Fuel / Energy Efficiency', hint: 'Irit BBM atau irit listrik.' },
      { id: 'financing', name: 'Financing Accessibility', hint: 'DP ringan, cicilan gampang disetujui.' },
      { id: 'network', name: 'Service Network Coverage', hint: 'Bengkel resmi tersebar luas.' },
    ];

    const BRANDS = [
      { id: 'hyundai', name: 'Hyundai', cat: 'EV' },
      { id: 'kia', name: 'Kia', cat: 'EV' },
      { id: 'byd', name: 'BYD', cat: 'EV' },
      { id: 'wuling', name: 'Wuling', cat: 'EV' },
      { id: 'jaecoo', name: 'Jaecoo', cat: 'EV' },
      { id: 'toyota', name: 'Toyota', cat: 'ICE' },
      { id: 'honda', name: 'Honda', cat: 'ICE' },
      { id: 'mitsubishi', name: 'Mitsubishi', cat: 'ICE' },
    ];

    const POINTS = [3, 2, 1];

    let state = {
      screen: 'welcome',
      respondent: '',
      roundIndex: 0,
      picks: {},
    };

    const app = document.getElementById('app');

    function shuffledBrands(seed) {
      const arr = [...BRANDS];
      let s = seed;
      for (let i = arr.length - 1; i > 0; i--) {
        s = (s * 9301 + 49297) % 233280;
        const j = Math.floor((s / 233280) * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function render() {
      if (state.screen === 'welcome') return renderWelcome();
      if (state.screen === 'info') return renderInfo();
      if (state.screen === 'survey') return renderSurvey();
      if (state.screen === 'complete') return renderComplete();
      if (state.screen === 'results') return renderResults();
    }

    function renderWelcome() {
      app.innerHTML = `
    <div class="top">
      <div class="brand-mark">CARD<span>SORT</span> // AUTO PERCEPTION</div>
      <a class="results-link" href="#" id="toResults">VIEW RESULTS →</a>
    </div>
    <div class="panel">
      <div class="eyebrow">Round-based brand ranking</div>
      <h1>What actually wins, attribute by attribute.</h1>
      <p class="lede">You'll go through ${ATTRIBUTES.length} rounds. Each round names one thing that matters when buying a car in Indonesia. Pick your top 3 brands for that one thing, in order. ${BRANDS.length} brands, ${ATTRIBUTES.length} rounds, no wrong answers.</p>
      <button class="btn" style="margin-top:22px" id="start">Start</button>
    </div>
    <p class="muted-note">Your picks are saved under whatever name or code you enter next. Aggregate results are visible to anyone with this link.</p>
  `;
      document.getElementById('start').onclick = () => { state.screen = 'info'; render(); };
      document.getElementById('toResults').onclick = (e) => { e.preventDefault(); state.screen = 'results'; render(); };
    }

    function renderInfo() {
      app.innerHTML = `
    <div class="top"><div class="brand-mark">CARD<span>SORT</span></div><div></div></div>
    <div class="panel">
      <div class="eyebrow">Before you begin</div>
      <h2>What should we call you?</h2>
      <p class="lede">A first name or initials is enough. This just keeps your set of answers together.</p>
      <input type="text" id="nameInput" placeholder="e.g. Kenzie, or K.R." maxlength="40">
      <div class="footer-row">
        <span></span>
        <button class="btn" id="continueBtn" disabled>Continue</button>
      </div>
    </div>
  `;
      const inp = document.getElementById('nameInput');
      const btn = document.getElementById('continueBtn');
      inp.oninput = () => { btn.disabled = inp.value.trim().length === 0; };
      inp.focus();
      btn.onclick = () => {
        state.respondent = inp.value.trim();
        state.roundIndex = 0;
        state.picks = {};
        state.screen = 'survey';
        render();
      };
    }

    function renderSurvey() {
      const attr = ATTRIBUTES[state.roundIndex];
      const order = shuffledBrands(attr.id.length + state.roundIndex + state.respondent.length);
      const currentPicks = state.picks[attr.id] || [];

      const gaugeHtml = ATTRIBUTES.map((a, i) => {
        let cls = '';
        if (i < state.roundIndex) cls = 'done';
        else if (i === state.roundIndex) cls = 'current';
        return `<div class="tick ${cls}"></div>`;
      }).join('');

      const podiumHtml = [0, 1, 2].map(i => {
        const bId = currentPicks[i];
        if (!bId) {
          return `<div class="slot"><span class="rank-label">P${i + 1}</span><div class="placeholder">TAP A<br>CARD</div></div>`;
        }
        const b = BRANDS.find(x => x.id === bId);
        return `<div class="slot filled" data-slotidx="${i}"><span class="rank-label">P${i + 1}</span><div class="brand-name">${b.name}</div><div class="clear-x">tap to remove</div></div>`;
      }).join('');

      const gridHtml = order.map(b => {
        const picked = currentPicks.includes(b.id);
        return `<div class="card ${picked ? 'picked' : ''}" data-brandid="${b.id}">
      <span class="name">${b.name}</span>
      <span class="cat">${b.cat}</span>
    </div>`;
      }).join('');

      app.innerHTML = `
    <div class="top">
      <div class="brand-mark">CARD<span>SORT</span></div>
      <span class="round-count">ROUND ${state.roundIndex + 1} / ${ATTRIBUTES.length}</span>
    </div>
    <div class="gauge">${gaugeHtml}</div>
    <div class="panel">
      <div class="eyebrow">${attr.name}</div>
      <h2>Rank your top 3 brands for this.</h2>
      <p class="lede">${attr.hint}</p>
      <div class="podium">${podiumHtml}</div>
      <div class="grid">${gridHtml}</div>
      <div class="footer-row">
        <button class="btn-ghost" id="backBtn" ${state.roundIndex === 0 ? 'disabled' : ''}>Back</button>
        <button class="btn" id="nextBtn" ${currentPicks.length < 3 ? 'disabled' : ''}>${state.roundIndex === ATTRIBUTES.length - 1 ? 'Finish' : 'Next round'}</button>
      </div>
    </div>
  `;

      document.querySelectorAll('.card').forEach(card => {
        card.onclick = () => {
          const id = card.dataset.brandid;
          const picks = state.picks[attr.id] || [];
          if (picks.includes(id) || picks.length >= 3) return;
          state.picks[attr.id] = [...picks, id];
          render();
        };
      });
      document.querySelectorAll('.slot.filled').forEach(slot => {
        slot.onclick = () => {
          const idx = parseInt(slot.dataset.slotidx);
          const picks = [...(state.picks[attr.id] || [])];
          picks.splice(idx, 1);
          state.picks[attr.id] = picks;
          render();
        };
      });
      document.getElementById('backBtn').onclick = () => {
        if (state.roundIndex > 0) { state.roundIndex--; render(); }
      };
      document.getElementById('nextBtn').onclick = async () => {
        if ((state.picks[attr.id] || []).length < 3) return;
        if (state.roundIndex < ATTRIBUTES.length - 1) {
          state.roundIndex++;
          render();
        } else {
          await submitResponse();
        }
      };
    }

    async function submitResponse() {
      app.innerHTML = `<div class="panel"><p class="lede">Saving your answers…</p></div>`;
      try {
        const res = await fetch('/api/responses', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: state.respondent, picks: state.picks })
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.error || `Request failed (${res.status})`);
        }
        state.screen = 'complete';
        render();
      } catch (e) {
        app.innerHTML = `<div class="panel"><p class="lede">Couldn't save your answers (${e.message || 'unknown error'}). Please try again.</p><button class="btn" id="retry" style="margin-top:16px">Retry</button></div>`;
        document.getElementById('retry').onclick = submitResponse;
      }
    }

    function renderComplete() {
      app.innerHTML = `
    <div class="top"><div class="brand-mark">CARD<span>SORT</span></div><div></div></div>
    <div class="panel">
      <div class="eyebrow">Done</div>
      <h1>Thanks, ${state.respondent}.</h1>
      <p class="lede">Your ${ATTRIBUTES.length} rounds are saved. You can view how everyone's answers stack up so far.</p>
      <div class="footer-row">
        <button class="btn-ghost" id="restart">Take again</button>
        <button class="btn" id="seeResults">View results</button>
      </div>
    </div>
  `;
      document.getElementById('restart').onclick = () => { state.screen = 'welcome'; render(); };
      document.getElementById('seeResults').onclick = () => { state.screen = 'results'; render(); };
    }

    async function renderResults() {
      app.innerHTML = `
    <div class="top"><div class="brand-mark">CARD<span>SORT</span></div><a class="results-link" href="#" id="backHome">← BACK</a></div>
    <div class="panel"><p class="lede">Loading responses…</p></div>
  `;
      document.getElementById('backHome').onclick = (e) => { e.preventDefault(); state.screen = 'welcome'; render(); };

      let responses = [];
      try {
        const res = await fetch('/api/responses');
        if (res.ok) {
          const body = await res.json();
          responses = body.responses || [];
        }
      } catch (e) {
        responses = [];
      }

      const scores = {};
      ATTRIBUTES.forEach(a => { scores[a.id] = {}; BRANDS.forEach(b => { scores[a.id][b.id] = 0; }); });
      responses.forEach(r => {
        ATTRIBUTES.forEach(a => {
          const picks = (r.picks && r.picks[a.id]) || [];
          picks.forEach((bId, i) => {
            if (scores[a.id][bId] !== undefined) scores[a.id][bId] += POINTS[i];
          });
        });
      });

      const attrRows = ATTRIBUTES.map(a => {
        const ranked = BRANDS.map(b => ({ b, score: scores[a.id][b.id] })).sort((x, y) => y.score - x.score);
        return { attr: a, ranked };
      });

      const strengths = {};
      BRANDS.forEach(b => strengths[b.id] = []);
      attrRows.forEach(({ attr, ranked }) => {
        const top = ranked[0];
        const second = ranked[1];
        if (top.score > 0 && top.score > second.score) {
          strengths[top.b.id].push({ attr: attr.name, margin: top.score - second.score, score: top.score });
        }
      });

      const topRowsHtml = attrRows.map(({ attr, ranked }) => {
        const top3 = ranked.slice(0, 3).map((r, i) => `<span class="${i === 0 ? 'lead' : ''}">${r.b.name} (${r.score})</span>`).join(' · ');
        return `<tr><td class="attr">${attr.name}</td><td class="score">${top3}</td></tr>`;
      }).join('');

      const strengthBlocks = BRANDS.map(b => {
        const list = strengths[b.id].sort((x, y) => y.margin - x.margin);
        if (list.length === 0) return '';
        const items = list.map(s => `<li>${s.attr} <span class="margin">(led by ${s.margin} pt${s.margin === 1 ? '' : 's'})</span></li>`).join('');
        return `<div class="strength-block"><h3>${b.name}</h3><ul>${items}</ul></div>`;
      }).join('');

      const fullTableHtml = `
    <table id="fullTable" style="display:none">
      <thead><tr><th>Attribute</th>${BRANDS.map(b => `<th>${b.name}</th>`).join('')}</tr></thead>
      <tbody>
        ${ATTRIBUTES.map(a => `<tr><td class="attr">${a.name}</td>${BRANDS.map(b => `<td class="score">${scores[a.id][b.id]}</td>`).join('')}</tr>`).join('')}
      </tbody>
    </table>
  `;

      app.innerHTML = `
    <div class="top"><div class="brand-mark">CARD<span>SORT</span></div><a class="results-link" href="#" id="backHome2">← BACK</a></div>
    <div class="panel">
      <div class="eyebrow">${responses.length} response${responses.length === 1 ? '' : 's'} collected</div>
      <h2>Leader per attribute</h2>
      <table><thead><tr><th>Attribute</th><th>Top 3 (weighted score)</th></tr></thead><tbody>${topRowsHtml || '<tr><td colspan="2">No responses yet.</td></tr>'}</tbody></table>
      <button class="toggle" id="toggleTable">Show full score matrix</button>
      ${fullTableHtml}
    </div>
    <h2 style="margin:26px 0 6px">Key strengths by brand</h2>
    <p class="lede" style="margin-bottom:6px">Attributes where a brand leads outright, i.e. the strongest candidates for a narrative-driven campaign angle.</p>
    ${strengthBlocks || '<p class="lede">Not enough data yet.</p>'}
    <p class="muted-note">Scoring: rank 1 = 3 pts, rank 2 = 2 pts, rank 3 = 1 pt, summed across respondents. With a pool this size (target n=6), treat margins under 2–3 points as noise, not signal.</p>
  `;
      document.getElementById('backHome2').onclick = (e) => { e.preventDefault(); state.screen = 'welcome'; render(); };
      document.getElementById('toggleTable').onclick = () => {
        const t = document.getElementById('fullTable');
        const btn = document.getElementById('toggleTable');
        if (t.style.display === 'none') { t.style.display = 'table'; btn.textContent = 'Hide full score matrix'; }
        else { t.style.display = 'none'; btn.textContent = 'Show full score matrix'; }
      };
    }

    render();
  </script>
</body>

</html>
